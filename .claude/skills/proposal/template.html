<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* Design source of truth: Figma "Project Proposal Template", node 405:3.
     The frame is 595x842 — A4 at 72dpi, so 1 Figma unit == 1pt exactly.
     Everything below is therefore in pt and maps 1:1 to the design, and
     prints at true A4 without any scaling fudge. */
  :root {
    --ink: #333333;      /* Figma "Gray 1" — headings, body, rules */
    --muted: #828282;    /* Figma "Gray 3" — the Total label */
    --page: #fafafa;
    --label: #000000;    /* item names are pure black in the design */

    --margin: 31pt;
    --col-label: 151pt;  /* 31 -> 182 */
    --col-body: 381pt;   /* 182 -> 563 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #e9e9e9; }

  /* TT Norms Pro is the licensed face used in the Figma file. It is listed
     first so it renders correctly on a machine that has it; Figtree is the
     closest free geometric fallback for everyone else. */
  body {
    font-family: 'TT Norms Pro', 'Figtree', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    width: 595pt;
    min-height: 842pt;
    margin: 24pt auto;
    padding: 43pt var(--margin) 40pt;
    background: var(--page);
    position: relative;
  }

  /* ── Masthead ─────────────────────────────────────────────────────────── */
  .rule-top { height: 5pt; width: 227pt; background: var(--ink); }
  .masthead {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 9pt;
  }
  .masthead h1,
  .masthead .client {
    font-size: 24pt; font-weight: 700; letter-spacing: -0.34pt;
    margin: 0; line-height: 1.2;
  }

  /* ── Line items ───────────────────────────────────────────────────────── */
  .item {
    display: grid;
    grid-template-columns: var(--col-label) var(--col-body);
    margin-top: 46pt;
    break-inside: avoid; page-break-inside: avoid;
  }
  .item-name {
    font-size: 14pt; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.7pt; color: var(--label); line-height: 1.35;
  }
  .item-body { font-size: 14pt; line-height: 1.35; }
  .timeline { margin: 0; }
  .desc { margin: 0; }
  .rule { height: 5pt; background: var(--ink); margin-top: 20pt; }
  .amount-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 16pt;
  }
  .total-label { font-size: 14pt; color: var(--muted); }
  .amount { font-size: 20pt; }

  /* ── Grand total ──────────────────────────────────────────────────────────
     Not present in the Figma frame, which stops at per-item totals. Extended
     in the same language — same grid, same rule, one step up in weight — so a
     multi-item proposal still resolves to a single number. */
  .grand {
    display: grid;
    grid-template-columns: var(--col-label) var(--col-body);
    margin-top: 46pt;
    break-inside: avoid; page-break-inside: avoid;
  }
  .grand .rule-full { grid-column: 1 / -1; height: 5pt; background: var(--ink); }
  .grand-label {
    font-size: 14pt; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.7pt; color: var(--label); margin-top: 16pt;
  }
  .grand-value {
    font-size: 24pt; font-weight: 700; text-align: right;
    letter-spacing: -0.34pt; margin-top: 16pt;
  }

  /* ── Terms ────────────────────────────────────────────────────────────── */
  /* Deliberately NOT break-inside:avoid. Terms grow with every clause added,
     and forcing the whole block to stay together shunts all of them to the
     next page and leaves a hole. Break between terms; never inside one. */
  .terms {
    display: grid;
    grid-template-columns: var(--col-label) var(--col-body);
    margin-top: 46pt;
  }
  .terms-label {
    font-size: 14pt; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.7pt; color: var(--label);
  }
  .terms ul { margin: 0; padding-left: 14pt; }
  .terms li {
    font-size: 14pt; line-height: 1.35; margin-bottom: 10pt;
    break-inside: avoid; page-break-inside: avoid;
  }
  .terms li:last-child { margin-bottom: 0; }
  .terms strong { font-weight: 700; }

  .meta {
    display: flex; justify-content: space-between;
    margin-top: 46pt; font-size: 10pt; color: var(--muted);
  }

  /* ── Print ──────────────────────────────────────────────────────────────
     Margins live on @page, not as padding on .page. Padding only applies once
     at the start of the flow, so on a multi-page proposal page 2 would start
     flush against the top edge. The values match the design's 31pt gutters. */
  @page { size: A4; margin: 43pt 31pt 40pt; }
  @media print {
    /* Background is set on body so it propagates to the full page canvas,
       including the @page margin area — otherwise the tinted sheet would stop
       at the content box and sit on white margins. */
    html, body { background: var(--page); }
    .page {
      margin: 0; padding: 0; width: auto; min-height: auto;
      background: transparent; box-shadow: none;
    }
    html, body, .rule-top, .rule, .rule-full {
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
  }
</style>
</head>
<body>
<div class="page">

  <div class="rule-top"></div>
  <div class="masthead">
    <h1>{{TITLE}}</h1>
    <div class="client">{{CLIENT}}</div>
  </div>

  <!-- ROW: duplicate this <section> per line item -->
  <section class="item">
    <div class="item-name">{{ITEM_NAME}}</div>
    <div class="item-body">
      <p class="timeline">Timeline: {{ITEM_TIMELINE}}</p>
      <p class="desc">{{ITEM_DESC}}</p>
      <div class="rule"></div>
      <div class="amount-row">
        <span class="total-label">Total</span>
        <span class="amount">{{ITEM_TOTAL}}</span>
      </div>
    </div>
  </section>
  <!-- /ROW -->

  <section class="grand">
    <div class="rule-full"></div>
    <div class="grand-label">Total Due</div>
    <div class="grand-value">{{TOTAL}}</div>
  </section>

  <section class="terms">
    <div class="terms-label">Terms</div>
    <ul>
      <!-- TERM: duplicate this <li> per term -->
      <li>{{TERM}}</li>
      <!-- /TERM -->
    </ul>
  </section>

  <div class="meta">
    <span>Prepared for {{CLIENT}}</span>
    <span>{{DATE}}</span>
  </div>

</div>
</body>
</html>
